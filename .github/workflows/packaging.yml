name: Multi-Platform Release Packaging

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

env:
  SQLX_OFFLINE: 'true'
  CARGO_TERM_COLOR: always

jobs:
  # The deployable artifact of this repo is the storyteller-web service binary (the GHCR
  # Docker image in docker-publish-cpu.yml wraps it). Package it as tarballs for both
  # supported Linux server architectures.
  package-linux:
    name: Linux (${{ matrix.target.arch }} / storyteller-web tarball)
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { arch: x86_64, triple: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { arch: aarch64, triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libfontconfig-dev protobuf-compiler
      - name: Build storyteller-web
        run: cargo build --release --locked -p storyteller-web --target ${{ matrix.target.triple }}
      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf "dist/storyteller-web-linux-${{ matrix.target.arch }}.tar.gz" \
            -C "target/${{ matrix.target.triple }}/release" storyteller-web
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target.arch }}-storyteller-web
          path: dist/*.tar.gz
